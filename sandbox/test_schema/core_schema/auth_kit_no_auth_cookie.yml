openapi: 3.0.3
info:
  title: DRF Auth Kit API Documentation
  version: 1.0.0
  description: DRF Auth Kit OpenAPI specification
paths:
  /auth/login/:
    post:
      operationId: login_create
      description: Authenticate with username/email and password to obtain access
        tokens. Returns user details along with JWT access and refresh tokens with
        expiration times. Authentication cookies are set automatically for secure
        token storage.
      tags:
      - login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /auth/logout/:
    post:
      operationId: logout_create
      description: Logout user and invalidate authentication tokens. Blacklists JWT
        refresh tokens to prevent further use. Clears authentication cookies from
        the browser. Requires authentication to ensure only valid sessions can be
        logged out.
      tags:
      - logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JWTLogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JWTLogoutRequest'
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWTLogout'
          description: ''
  /auth/password/change/:
    post:
      operationId: password_change_create
      description: 'Change the current user''s password. Requires authentication. '
      tags:
      - password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChange'
          description: ''
  /auth/password/reset/:
    post:
      operationId: password_reset_create
      description: Send password reset instructions to the provided email address.
        If the email is registered, a secure reset link will be sent. The link expires
        after a limited time for security.
      tags:
      - password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordReset'
          description: ''
  /auth/password/reset/confirm/:
    post:
      operationId: password_reset_confirm_create
      description: Complete the password reset process using the token from the reset
        email. Requires the UID and token from the email along with the new password.
        The token is single-use and expires for security.
      tags:
      - password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirm'
          description: ''
  /auth/passwordless/email/initiate/:
    post:
      operationId: passwordless_email_initiate
      description: Initiate passwordless authentication via Email Magic Link. This
        is the first step of the passwordless login flow.
      tags:
      - passwordless
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailLinkInitiateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailLinkInitiateRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailLinkInitiate'
          description: ''
  /auth/passwordless/email/verify/:
    post:
      operationId: passwordless_email_verify
      description: Complete passwordless authentication via Email Magic Link. Verify
        the credential/token from the initiate step. Returns user details along with
        JWT access and refresh tokens with expiration times.
      tags:
      - passwordless
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordlessEmailVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordlessEmailVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordlessEmailVerify'
          description: ''
  /auth/passwordless/webauthn/initiate/:
    post:
      operationId: passwordless_webauthn_initiate
      description: Initiate passwordless authentication via Passkey / Security Key.
        This is the first step of the passwordless login flow.
      tags:
      - passwordless
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnInitiateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebAuthnInitiateRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnInitiate'
          description: ''
  /auth/passwordless/webauthn/verify/:
    post:
      operationId: passwordless_webauthn_verify
      description: Complete passwordless authentication via Passkey / Security Key.
        Verify the credential/token from the initiate step. Returns user details along
        with JWT access and refresh tokens with expiration times.
      tags:
      - passwordless
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordlessWebauthnVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordlessWebauthnVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordlessWebauthnVerify'
          description: ''
  /auth/registration/:
    post:
      operationId: registration_create
      description: Register a new user account. Users must verify their email address
        before the account is fully activated.
      tags:
      - registration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /auth/registration/resend-email/:
    post:
      operationId: registration_resend_email_create
      description: Send a new email verification message to unverified email addresses.
        Only works for email addresses that are registered but not yet verified.
      tags:
      - registration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendEmailVerification'
          description: ''
  /auth/registration/verify-email/:
    get:
      operationId: registration_verify_email_retrieve
      description: GET method not allowed for email verification.
      tags:
      - registration
      security:
      - {}
      responses:
        '405':
          description: Method not allowed
    post:
      operationId: registration_verify_email_create
      description: Confirm email address using the verification key sent via email.
        This activates the user account and allows login access.
      tags:
      - registration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmail'
          description: ''
  /auth/token/refresh/:
    post:
      operationId: token_refresh_create
      description: Generate new JWT access tokens using refresh tokens. Refresh tokens
        can be provided in request data or extracted automatically from HTTP cookies.
        Returns new access tokens with updated expiration times. New tokens are automatically
        set in HTTP cookies for secure storage.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieTokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CookieTokenRefreshRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookieTokenRefresh'
          description: ''
  /auth/token/verify/:
    post:
      operationId: token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /auth/user/:
    get:
      operationId: user_retrieve
      description: Retrieve the authenticated user's profile information including
        username, email, first name, and last name. Password fields are excluded.
      tags:
      - user
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: user_update
      description: Update the authenticated user's profile information. Allows modification
        of username, first name, and last name. Email field is read-only for security.
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: user_partial_update
      description: Partially update the authenticated user's profile information.
        Only provided fields will be updated. Email field is read-only.
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
components:
  schemas:
    CookieTokenRefresh:
      type: object
      description: JWT token refresh with cookie and request data support.
      properties:
        access:
          type: string
          readOnly: true
        access_expiration:
          type: string
          format: date-time
          readOnly: true
    CookieTokenRefreshRequest:
      type: object
      description: JWT token refresh with cookie and request data support.
      properties:
        refresh:
          type: string
          writeOnly: true
          description: Will override cookie.
    EmailLinkInitiate:
      type: object
      description: |-
        Serializer for the email magic link initiate step.

        Accepts the address to send the magic link to and returns the
        confirmation message.

        Attributes:
            email: Email address to send the magic link to
            detail: Confirmation message
      properties:
        detail:
          type: string
          readOnly: true
    EmailLinkInitiateRequest:
      type: object
      description: |-
        Serializer for the email magic link initiate step.

        Accepts the address to send the magic link to and returns the
        confirmation message.

        Attributes:
            email: Email address to send the magic link to
            detail: Confirmation message
      properties:
        email:
          type: string
          format: email
          writeOnly: true
          minLength: 1
      required:
      - email
    JWTLogout:
      type: object
      description: JWT logout with refresh token blacklisting.
      properties:
        detail:
          type: string
          readOnly: true
    JWTLogoutRequest:
      type: object
      description: JWT logout with refresh token blacklisting.
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
    Login:
      type: object
      description: User authentication with credentials response.
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
        access_expiration:
          type: string
          format: date-time
          readOnly: true
        refresh_expiration:
          type: string
          format: date-time
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
    LoginRequest:
      type: object
      description: User authentication with credentials response.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    PasswordChange:
      type: object
      description: Password change for authenticated users.
      properties:
        detail:
          type: string
          readOnly: true
    PasswordChangeRequest:
      type: object
      description: Password change for authenticated users.
      properties:
        new_password1:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        new_password2:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - new_password1
      - new_password2
    PasswordReset:
      type: object
      description: Password reset request with email verification.
      properties:
        detail:
          type: string
          readOnly: true
    PasswordResetConfirm:
      type: object
      description: Password reset confirmation with new password.
      properties:
        detail:
          type: string
          readOnly: true
    PasswordResetConfirmRequest:
      type: object
      description: Password reset confirmation with new password.
      properties:
        new_password1:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        new_password2:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        uid:
          type: string
          writeOnly: true
          minLength: 1
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password1
      - new_password2
      - token
      - uid
    PasswordResetRequest:
      type: object
      description: Password reset request with email verification.
      properties:
        email:
          type: string
          format: email
          writeOnly: true
          minLength: 1
      required:
      - email
    PasswordlessEmailVerify:
      type: object
      description: Passwordless verify step serializer.
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
        access_expiration:
          type: string
          format: date-time
          readOnly: true
        refresh_expiration:
          type: string
          format: date-time
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
    PasswordlessEmailVerifyRequest:
      type: object
      description: Passwordless verify step serializer.
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    PasswordlessWebauthnVerify:
      type: object
      description: Passwordless verify step serializer.
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
        access_expiration:
          type: string
          format: date-time
          readOnly: true
        refresh_expiration:
          type: string
          format: date-time
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
    PasswordlessWebauthnVerifyRequest:
      type: object
      description: Passwordless verify step serializer.
      properties:
        credential:
          writeOnly: true
        session_id:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - credential
      - session_id
    PatchedUserRequest:
      type: object
      description: User profile information and updates.
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
    PublicKeyCredentialDescriptor:
      type: object
      description: A credential descriptor used in allowCredentials / excludeCredentials.
      properties:
        id:
          type: string
          description: Base64URL-encoded credential ID
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          default: public-key
          description: |-
            Credential type

            * `public-key` - public-key
        transports:
          type: array
          items:
            $ref: '#/components/schemas/TransportsEnum'
          description: Transport hints for reaching the authenticator
      required:
      - id
    PublicKeyCredentialDescriptorRequest:
      type: object
      description: A credential descriptor used in allowCredentials / excludeCredentials.
      properties:
        id:
          type: string
          minLength: 1
          description: Base64URL-encoded credential ID
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          default: public-key
          description: |-
            Credential type

            * `public-key` - public-key
        transports:
          type: array
          items:
            $ref: '#/components/schemas/TransportsEnum'
          description: Transport hints for reaching the authenticator
      required:
      - id
    Register:
      type: object
      description: User registration with email verification.
      properties:
        detail:
          type: string
          readOnly: true
    RegisterRequest:
      type: object
      description: User registration with email verification.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        email:
          type: string
          format: email
          writeOnly: true
          minLength: 1
        password1:
          type: string
          writeOnly: true
          minLength: 1
        password2:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          writeOnly: true
        last_name:
          type: string
          writeOnly: true
      required:
      - email
      - password1
      - password2
      - username
    ResendEmailVerification:
      type: object
      description: Request new email verification message.
      properties:
        detail:
          type: string
          readOnly: true
    ResendEmailVerificationRequest:
      type: object
      description: Request new email verification message.
      properties:
        email:
          type: string
          format: email
          writeOnly: true
          minLength: 1
      required:
      - email
    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    TransportsEnum:
      enum:
      - usb
      - nfc
      - ble
      - smart-card
      - internal
      - cable
      - hybrid
      type: string
      description: |-
        * `usb` - usb
        * `nfc` - nfc
        * `ble` - ble
        * `smart-card` - smart-card
        * `internal` - internal
        * `cable` - cable
        * `hybrid` - hybrid
    TypeEnum:
      enum:
      - public-key
      type: string
      description: '* `public-key` - public-key'
    User:
      type: object
      description: User profile information and updates.
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - username
    UserRequest:
      type: object
      description: User profile information and updates.
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - username
    UserVerificationEnum:
      enum:
      - required
      - preferred
      - discouraged
      type: string
      description: |-
        * `required` - required
        * `preferred` - preferred
        * `discouraged` - discouraged
    VerifyEmail:
      type: object
      description: Email address verification with confirmation key.
      properties:
        detail:
          type: string
          readOnly: true
    VerifyEmailRequest:
      type: object
      description: Email address verification with confirmation key.
      properties:
        key:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - key
    WebAuthnInitiate:
      type: object
      description: |-
        Serializer for the WebAuthn initiate step.

        Optionally accepts an email to filter credentials for
        non-discoverable (security key) flows. If omitted,
        discoverable credential (passkey) flow is used. Inherits the
        ceremony options that make up the response.

        Attributes:
            email: Optional email to look up user credentials
      properties:
        challenge:
          type: string
          readOnly: true
          description: Base64URL-encoded challenge
        timeout:
          type: integer
          readOnly: true
          description: Ceremony timeout in milliseconds
        rpId:
          type: string
          readOnly: true
          description: Relying Party ID (domain)
        allowCredentials:
          type: array
          items:
            $ref: '#/components/schemas/PublicKeyCredentialDescriptor'
          readOnly: true
          description: Allowed credentials for this authentication
        userVerification:
          allOf:
          - $ref: '#/components/schemas/UserVerificationEnum'
          readOnly: true
          description: |-
            User verification requirement

            * `required` - required
            * `preferred` - preferred
            * `discouraged` - discouraged
        session_id:
          type: string
          readOnly: true
          description: Opaque session token for the verify step
    WebAuthnInitiateRequest:
      type: object
      description: |-
        Serializer for the WebAuthn initiate step.

        Optionally accepts an email to filter credentials for
        non-discoverable (security key) flows. If omitted,
        discoverable credential (passkey) flow is used. Inherits the
        ceremony options that make up the response.

        Attributes:
            email: Optional email to look up user credentials
      properties:
        email:
          type: string
          format: email
          writeOnly: true
          minLength: 1
          description: Optional email for non-discoverable credential flow. Omit for
            passkey (discoverable) flow.
  securitySchemes:
    JWTAuthentication:
      type: http
      scheme: bearer
      bearerFormat: JWT
    JWTCookieAuthentication:
      type: apiKey
      in: cookie
      name: auth-jwt
