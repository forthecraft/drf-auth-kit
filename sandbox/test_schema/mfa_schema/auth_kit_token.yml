      type: object
      description: Serializer for WebAuthn MFA method setup response.
      properties:
        options:
          allOf:
          - $ref: '#/components/schemas/WebAuthnRegistrationOptions'
          readOnly: true
          description: Registration options for navigator.credentials.create()
    WebAuthnRegistrationOptions:
      type: object
      description: |-
        Structured serializer for WebAuthn registration ceremony options.

        Returned by ``services.begin_registration()`` and consumed by
        the browser's ``navigator.credentials.create()`` API.
      properties:
        rp:
          allOf:
          - $ref: '#/components/schemas/RelyingParty'
          readOnly: true
          description: Relying Party identity
        user:
          allOf:
          - $ref: '#/components/schemas/PublicKeyCredentialUser'
          readOnly: true
          description: User account information
        challenge:
          type: string
          readOnly: true
          description: Base64URL-encoded challenge
        pubKeyCredParams:
          type: array
          items:
            $ref: '#/components/schemas/PubKeyCredParam'
          readOnly: true
          description: Supported public-key credential parameters
        timeout:
          type: integer
          readOnly: true
          description: Ceremony timeout in milliseconds
        excludeCredentials:
          type: array
          items:
            $ref: '#/components/schemas/PublicKeyCredentialDescriptor'
          readOnly: true
          description: Credentials to exclude (already registered)
        authenticatorSelection:
          allOf:
          - $ref: '#/components/schemas/AuthenticatorSelection'
          readOnly: true
          description: Authenticator selection criteria
        attestation:
          allOf:
          - $ref: '#/components/schemas/AttestationEnum'
          readOnly: true
          description: |-
            Attestation conveyance preference

            * `none` - none
            * `indirect` - indirect
            * `direct` - direct
            * `enterprise` - enterprise
