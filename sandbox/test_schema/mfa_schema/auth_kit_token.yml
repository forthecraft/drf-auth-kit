    WebAuthnAuthenticationOptions:
      type: object
      description: |-
        Structured serializer for WebAuthn authentication ceremony options.

        Returned by ``services.begin_authentication()`` and consumed by
        the browser's ``navigator.credentials.get()`` API.
      properties:
        challenge:
          type: string
          readOnly: true
          description: Base64URL-encoded challenge
        timeout:
          type: integer
          readOnly: true
          description: Ceremony timeout in milliseconds
        rpId:
          type: string
          readOnly: true
          description: Relying Party ID (domain)
        allowCredentials:
          type: array
          items:
            $ref: '#/components/schemas/PublicKeyCredentialDescriptor'
          readOnly: true
          description: Allowed credentials for this authentication
        userVerification:
          allOf:
          - $ref: '#/components/schemas/UserVerificationEnum'
          readOnly: true
          description: |-
            User verification requirement

            * `required` - required
            * `preferred` - preferred
            * `discouraged` - discouraged
        session_id:
          type: string
          readOnly: true
          description: Opaque session token for the verify step
    WebAuthnInitiate:
      type: object
      description: |-
        Serializer for the WebAuthn initiate step.

        Optionally accepts an email to filter credentials for
        non-discoverable (security key) flows. If omitted,
        discoverable credential (passkey) flow is used. Inherits the
        ceremony options that make up the response.

        Attributes:
            email: Optional email to look up user credentials
      properties:
        challenge:
          type: string
          readOnly: true
          description: Base64URL-encoded challenge
        timeout:
          type: integer
          readOnly: true
          description: Ceremony timeout in milliseconds
        rpId:
          type: string
          readOnly: true
          description: Relying Party ID (domain)
        allowCredentials:
          type: array
          items:
            $ref: '#/components/schemas/PublicKeyCredentialDescriptor'
          readOnly: true
          description: Allowed credentials for this authentication
        userVerification:
          allOf:
          - $ref: '#/components/schemas/UserVerificationEnum'
          readOnly: true
          description: |-
            User verification requirement

            * `required` - required
            * `preferred` - preferred
            * `discouraged` - discouraged
        session_id:
          type: string
          readOnly: true
          description: Opaque session token for the verify step
    WebAuthnInitiateRequest:
      type: object
      description: |-
        Serializer for the WebAuthn initiate step.

        Optionally accepts an email to filter credentials for
        non-discoverable (security key) flows. If omitted,
        discoverable credential (passkey) flow is used. Inherits the
        ceremony options that make up the response.

        Attributes:
            email: Optional email to look up user credentials
      properties:
        email:
          type: string
          format: email
          writeOnly: true
          minLength: 1
          description: Optional email for non-discoverable credential flow. Omit for
            passkey (discoverable) flow.
